# Machine-enforced gate: run the deterministic pure-Python suite (profile loader,
# world-gen golden byte-identity, course) on every PR + push to main.
# Gazebo/ROS runtime (sensor_harness, course_monitor, the launch) can't run in CI —
# that's the VM drive-equivalence step (see CLAUDE.md "Definition of done").
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run pure-Python suite
        working-directory: igvc_competition_sim
        run: python -m pytest test/ -v
